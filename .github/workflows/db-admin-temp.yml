name: DB admin (temporary)

on:
  workflow_dispatch:
    inputs:
      sql_b64:
        description: Base64-encoded SQL to run
        required: true
      fetch:
        description: Use fetchall and print rows as JSON
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install asyncpg
      - name: Execute
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SQL_B64: ${{ inputs.sql_b64 }}
          FETCH: ${{ inputs.fetch }}
        run: |
          python - <<'PY'
          import asyncio, base64, json, os, re
          from urllib.parse import unquote, urlparse
          import asyncpg

          url = urlparse(os.environ["DATABASE_URL"])
          sql = base64.b64decode(os.environ["SQL_B64"]).decode()
          kwargs = dict(
              user=unquote(url.username or ""),
              password=unquote(url.password or ""),
              host=url.hostname,
              port=url.port or 5432,
              database=(url.path or "/postgres").lstrip("/"),
              ssl="require",
          )

          async def main():
              conn = await asyncpg.connect(**kwargs)
              try:
                  statements = [s.strip() for s in sql.split(";") if s.strip()]
                  fetch = os.environ.get("FETCH", "true").lower() == "true"
                  for i, stmt in enumerate(statements):
                      if fetch and i == len(statements) - 1:
                          rows = await conn.fetch(stmt)
                          print("RESULT_JSON=" + json.dumps([dict(r) for r in rows], default=str))
                      else:
                          status = await conn.execute(stmt)
                          print("STATUS=" + status)
              finally:
                  await conn.close()

          asyncio.run(main())
          PY
