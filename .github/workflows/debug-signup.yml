name: Debug signup (temporary)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install backend
        working-directory: backend
        run: uv sync
      - name: Run signup service
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          import traceback

          from sqlalchemy.ext.asyncio import AsyncSession, create_async_engine

          from app.services.signup import create_confirmed_user

          engine = create_async_engine(os.environ["DATABASE_URL"], pool_pre_ping=True)

          async def main():
              async with AsyncSession(engine) as session:
                  try:
                      result = await create_confirmed_user(
                          session,
                          "pokevault.qa.probe2.20261121@outlook.com",
                          "PokeVault!2026",
                      )
                      print("SIGNUP_RESULT=" + str(result))
                  except Exception:
                      traceback.print_exc()

          asyncio.run(main())
          PY
