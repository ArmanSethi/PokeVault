# Alembic configuration. The database URL is resolved at runtime in alembic/env.py
# from the environment (ALEMBIC_DATABASE_URL, falling back to DATABASE_URL), so no
# credentials live in this file.

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally left blank — set in env.py from the environment.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
