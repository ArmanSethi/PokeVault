[project]
name = "pokevault-backend"
version = "0.1.0"
description = "PokéVault backend — FastAPI service for the Pokémon collection tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "pytesseract>=0.3.13",
    "rapidfuzz>=3.9",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.ruff.lint.isort]
# Classify the app package as first-party everywhere (e.g. in tests/ and alembic/,
# which live outside the `src` roots and would otherwise sort `app` as third-party).
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
