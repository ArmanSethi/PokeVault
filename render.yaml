# Render Blueprint for the PokéVault backend (free tier).
# Create the service via Render dashboard -> "New +" -> "Blueprint" pointed at this repo,
# then fill the sync:false secrets. Free web services sleep when idle and cold-start on the
# next request — fine for an MVP.
services:
  - type: web
    name: pokevault-api
    runtime: python
    plan: free
    rootDir: backend
    # uv manages the venv + lockfile; --frozen fails if uv.lock is stale (deterministic build).
    buildCommand: "pip install uv && uv sync --frozen"
    startCommand: "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Fill these in the dashboard (Environment tab). Never commit them.
      - key: DATABASE_URL # postgresql+asyncpg://...pooler.supabase.com:5432/postgres
        sync: false
      - key: POKEMONTCG_API_KEY
        sync: false
      - key: SUPABASE_URL # https://<ref>.supabase.co
        sync: false
      - key: BACKEND_CORS_ORIGINS # your Vercel URL, e.g. https://pokevault.vercel.app
        sync: false
